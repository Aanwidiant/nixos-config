# --- Apps & Launchers ---

# Terminal
bind=SUPER,Return,spawn,kitty

# File Manager (Thunar)
bind=SUPER+SHIFT,f,spawn_shell,my-launch-or-focus thunar

# Browser
bind=SUPER+SHIFT,b,spawn_shell,my-launch-browser
bind=SUPER+SHIFT+ALT,b,spawn_shell,my-launch-browser --private

# Editor
bind=SUPER+SHIFT,e,spawn,zeditor
bind=SUPER+SHIFT,n,spawn,kitty -e nvim

# --- System Tools (TUI) ---

# Btop
bind=SUPER+SHIFT,t,spawn_shell,my-launch-or-focus-tui btop

# Htop
bind=SUPER+ALT,t,spawn_shell,my-launch-or-focus-tui htop

# Lazydocker
bind=SUPER+SHIFT,d,spawn_shell,my-launch-or-focus-tui lazydocker

# Ncdu
bind=SUPER+ALT,d,spawn_shell,my-launch-or-focus-tui ncdu

# About
bind=SUPER+SHIFT,a,spawn_shell,my-launch-about

# Webcam
bind=SUPER+CTRL,w,spawn_shell,my-webcam

# Web Apps
bind=SUPER+ALT,w,spawn_shell,my-launch-webapp brave-browser --app=https://web.whatsapp.com/

# Email (Geary)
bind=SUPER+SHIFT,m,spawn_shell,my-launch-or-focus geary

# --- Special/Media Keys ---

# Display Settings (nwg-displays)
bind=NONE,XF86Display,spawn_shell,my-launch-or-focus nwg-displays

# WLAN/Network (Thunar? Mungkin maksudnya network manager, tapi sesuai request: Thunar)
bind=NONE,XF86WLAN,spawn_shell,my-launch-or-focus thunar

# Notification Center (Dbgate? Sesuai request)
bind=NONE,XF86NotificationCenter,spawn_shell,my-launch-or-focus dbgate

# Pickup Phone (Bruno API Client? Sesuai request)
bind=NONE,XF86PickupPhone,spawn_shell,my-launch-or-focus bruno

# Hangup Phone (Browser? Sesuai request)
bind=NONE,XF86HangupPhone,spawn_shell,my-launch-browser

# Favorites (Zeditor)
bind=NONE,XF86Favorites,spawn,zeditor

# --- Clipboard & Wtype ---

# Copy (Ctrl+Insert via wtype)
bind=SUPER+SHIFT,c,spawn,wtype -M ctrl -k Insert -m ctrl

# Paste (Shift+Insert via wtype)
bind=SUPER+SHIFT,v,spawn,wtype -M shift -k Insert -m shift

# Cut (Ctrl+X via wtype)
bind=SUPER+SHIFT,x,spawn,wtype -M ctrl -k x -m ctrl

# Clipboard Manager (Cliphist + Fuzzel)
bind=SUPER+CTRL,v,spawn_shell,cliphist list | my-launch-fuzzel dmenu --width 100 --lines 10 | cliphist decode | wl-copy

# --- Volume & Brightness ---

# Volume Control (Allow when locked)
bindl=NONE,XF86AudioRaiseVolume,spawn,swayosd-client --output-volume raise
bindl=NONE,XF86AudioLowerVolume,spawn,swayosd-client --output-volume lower
bindl=NONE,XF86AudioMute,spawn,swayosd-client --output-volume mute-toggle

# Mic Mute (Allow when locked)
bindl=NONE,XF86AudioMicMute,spawn,my-toggle-mic

# Brightness Control
bind=NONE,XF86MonBrightnessUp,spawn,swayosd-client --brightness raise
bind=NONE,XF86MonBrightnessDown,spawn,swayosd-client --brightness lower

# Precise Adjustments (1% step)
bind=ALT,XF86AudioRaiseVolume,spawn,swayosd-client --output-volume +1
bind=ALT,XF86AudioLowerVolume,spawn,swayosd-client --output-volume -1
bind=ALT,XF86MonBrightnessUp,spawn,swayosd-client --brightness +1
bind=ALT,XF86MonBrightnessDown,spawn,swayosd-client --brightness -1

# --- Launchers & Menus ---

# App Launcher (Fuzzel)
bind=SUPER,space,spawn,my-launch-fuzzel drun --placeholder Search --lines 8 --width 32

# Emoji Picker
bind=SUPER+CTRL,e,spawn,my-launch-emoji

# Main Menu
bind=SUPER+ALT,space,spawn,my-menu

# System Menu
bind=SUPER,Escape,spawn,my-menu system

# --- Aesthetics ---

# Toggle Waybar
bind=SUPER+SHIFT,space,spawn,my-toggle-waybar

# Next Background
bind=SUPER+CTRL,space,spawn,my-theme-bg-next

# --- Notifications (Mako) ---

# Dismiss Top Notification
bind=SUPER,comma,spawn,makoctl dismiss

# Dismiss All Notifications
bind=SUPER+SHIFT,comma,spawn,makoctl dismiss --all

# Toggle Do Not Disturb
bind=SUPER+CTRL,comma,spawn_shell,makoctl mode -t do-not-disturb && notify-send 'Toggled DND'

# Invoke/Show Notifications
bind=SUPER+ALT,comma,spawn,makoctl invoke

# --- System Utilities ---

# Toggle Idle Lock
bind=SUPER+CTRL,i,spawn,my-toggle-idle

# Toggle Nightlight
bind=SUPER+CTRL,n,spawn,my-toggle-nightlight

# --- Screenshots & Recording ---

# Screenshot Region
bind=NONE,Print,spawn,my-cmd-screenshot region

# Screenshot Fullscreen
bind=SHIFT,Print,spawn,my-cmd-screenshot fullscreen

# Screenrecord Menu
bind=ALT,Print,spawn,my-menu-screenrecord

# --- Info Notifications ---

# Date & Time Info
bind=SUPER+CTRL,t,spawn_shell,notify-send "$(date +'%A %H:%M — %d %B %Y')"

# Battery Info
bind=SUPER+CTRL,b,spawn_shell,notify-send "Battery $(my-battery-remaining)%"

# Toggle Touchpad
bind=SUPER+SHIFT,m,spawn,my-toggle-touchpad

# --- Vim-Style Navigation (HJKL) ---

# Focus Window (Tanpa Shift)
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

# Move/Swap Window (Dengan Shift)
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

# --- Monitor & Tag Navigation (Tetap menggunakan Arrow/Other Keys agar tidak bentrok) ---

# Focus Monitor
bind=SUPER+CTRL,h,focusmon,left
bind=SUPER+CTRL,l,focusmon,right
bind=SUPER+CTRL,k,focusmon,up
bind=SUPER+CTRL,j,focusmon,down

# View Tags (Workspaces)
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

# Move Window to Tag
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# View Left/Right Tag
bind=SUPER,z,viewtoleft,0
bind=SUPER,x,viewtoright,0

# Move Window to Left/Right Tag
bind=SUPER+SHIFT,z,tagtoleft,0
bind=SUPER+SHIFT,x,tagtoright,0

# --- Window Management Basics ---

# Toggle Overview/Jump
bind=SUPER,space,togglejump

# Close Window
bind=SUPER,q,killclient

# Toggle Floating
bind=SUPER,t,togglefloating

# Toggle Fullscreen
bind=SUPER,f,togglefullscreen

# Maximize Screen
bind=SUPER,c,togglemaximizescreen

# Center Floating Window
bind=SUPER+SHIFT,c,centerwin

# Pin to All Tags (Global)
bind=SUPER,g,toggleglobal

# Minimize to Scratchpad
bind=SUPER,i,minimized
bind=SUPER+SHIFT,i,restore_minimized

# Switch Layouts
bind=SUPER,n,switch_layout

