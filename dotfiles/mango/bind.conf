# Reload Config
bind=SUPER+SHIFT,r,reload_config

# Apps & Launchers
bind=SUPER,Return,spawn,kitty
bind=SUPER+SHIFT,f,spawn_shell,my-launch-or-focus thunar
bind=SUPER+SHIFT,b,spawn_shell,my-launch-browser
bind=SUPER+SHIFT+ALT,b,spawn_shell,my-launch-browser --private
bind=SUPER+SHIFT,e,spawn,zeditor
bind=SUPER+SHIFT,n,spawn,kitty -e nvim

# System Tools (TUI)
bind=SUPER+SHIFT,a,spawn_shell,my-launch-about
bind=SUPER+CTRL,w,spawn_shell,my-webcam
bind=SUPER+SHIFT,w,spawn_shell,my-launch-webapp brave-browser --app=https://web.whatsapp.com/

# Special/Media Keys
bind=NONE,XF86Display,spawn_shell,my-launch-or-focus-tui htop
bind=NONE,XF86WLAN,spawn_shell,my-launch-or-focus thunar
bind=NONE,XF86NotificationCenter,spawn_shell,my-launch-or-focus dbgate
bind=NONE,XF86PickupPhone,spawn_shell,my-launch-or-focus bruno
bind=NONE,XF86HangupPhone,spawn_shell,my-launch-browser
bind=NONE,XF86Favorites,spawn,zeditor

# Clipboard & Wtype
# bind=SUPER+SHIFT,c,spawn,wtype -M ctrl -k Insert -m ctrl
bind=SUPER+SHIFT,v,spawn,wtype -M shift -k Insert -m shift
# bind=SUPER+SHIFT,x,spawn,wtype -M ctrl -k x -m ctrl

# Volume & Brightness
bind=NONE,XF86AudioRaiseVolume,spawn,quickshell ipc call island volumeUp
bind=NONE,XF86AudioLowerVolume,spawn,quickshell ipc call island volumeDown
bind=NONE,XF86AudioMute,spawn,quickshell ipc call island volumeMute
bind=NONE,XF86AudioMicMute,spawn,quickshell ipc call island micMute
bind=NONE,XF86MonBrightnessUp,spawn,quickshell ipc call island brightnessUp
bind=NONE,XF86MonBrightnessDown,spawn,quickshell ipc call island brightnessDown

bind=ALT,XF86AudioRaiseVolume,spawn,quickshell ipc call island volumeUpFine
bind=ALT,XF86AudioLowerVolume,spawn,quickshell ipc call island volumeDownFine
bind=ALT,XF86MonBrightnessUp,spawn,quickshell ipc call island brightnessUpFine
bind=ALT,XF86MonBrightnessDown,spawn,quickshell ipc call island brightnessDownFine

# Launchers & Menus
bind=SUPER,space,spawn,quickshell ipc call island openLauncher
bind=SUPER+ALT,e,spawn,quickshell ipc call island openEmoji
bind=SUPER+ALT,space,spawn,quickshell ipc call island openControlCenter
bind=SUPER,Escape,spawn,quickshell ipc call island openPowerSystem 
bind=SUPER+ALT,k,spawn,quickshell ipc call island openKeybinds
bind=SUPER+ALT,c,spawn,quickshell ipc call island openClipboard 

# Aesthetics
bind=SUPER+SHIFT,space,spawn,my-toggle-waybar
bind=SUPER+CTRL,space,spawn,my-theme-bg-next

# Notifications 
bind=SUPER,comma,spawn,makoctl dismiss
bind=SUPER+SHIFT,comma,spawn,makoctl dismiss --all
bind=SUPER+CTRL,comma,spawn_shell,makoctl mode -t do-not-disturb && notify-send 'Toggled DND'
bind=SUPER+ALT,comma,spawn,makoctl invoke

# System Utilities
bind=SUPER+CTRL,i,spawn,my-toggle-idle
bind=SUPER+CTRL,n,spawn,my-toggle-nightlight
bind=NONE,Print,spawn,my-cmd-screenshot region
bind=SHIFT,Print,spawn,my-cmd-screenshot fullscreen
bind=ALT,Print,spawn,my-menu-screenrecord
bind=SUPER+CTRL,t,spawn_shell,notify-send "$(date +'%A %H:%M — %d %B %Y')"
bind=SUPER+CTRL,b,spawn_shell,notify-send "Battery $(my-battery-remaining)%"
bind=SUPER+SHIFT,m,spawn,my-toggle-touchpad

# Vim-Style Navigation (HJKL)
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

# Monitor & Tag Navigation
bind=SUPER+CTRL,h,focusmon,left
bind=SUPER+CTRL,l,focusmon,right
bind=SUPER+CTRL,k,focusmon,up
bind=SUPER+CTRL,j,focusmon,down

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

bind=SUPER,z,viewtoleft,0
bind=SUPER,x,viewtoright,0
bind=SUPER+SHIFT,z,tagtoleft,0
bind=SUPER+SHIFT,x,tagtoright,0

# Window Management Basics
bind=SUPER+SHIFT,q,killclient
bind=SUPER,t,togglefloating
bind=SUPER,f,togglefullscreen
bind=SUPER,c,togglemaximizescreen
bind=SUPER,r,switch_proportion_preset
bind=SUPER+SHIFT,c,centerwin
bind=SUPER,g,toggleglobal
bind=SUPER,n,switch_layout
bind=SUPER,Tab,togglejump

bind=SUPER,i,minimized
bind=SUPER+SHIFT,i,restore_minimized
bind=SUPER,s,toggle_scratchpad
# Mousebind
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
# Gesturebind
gesturebind=none,up,3,viewtoleft,0
gesturebind=none,down,3,viewtoright,0
# Axisbind
axisbind=SUPER,UP,viewtoleft,0
axisbind=SUPER,DOWN,viewtoright,0

