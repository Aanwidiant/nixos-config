source=~/.config/theme/current/theme/mango.conf

# Effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

# Shadows
shadows = 1
layer_shadows = 1
shadow_only_floating = 1
shadows_size = 6
shadows_blur = 12
shadows_position_x = 0
shadows_position_y = 0

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.85

# Appearance
gappih=3
gappiv=3
gappoh=4
gappov=4
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2

jump_label_decorate_border_width = 1
jump_label_decorate_corner_radius = 4
jump_label_decorate_padding_x = 4
jump_label_decorate_padding_y = 2
jump_label_decorate_font_desc = JetBrainsMono Nerd Fonts Regular 12

group_bar_decorate_border_width = 1
group_bar_decorate_corner_radius = 4
group_bar_decorate_padding_x = 4
group_bar_decorate_padding_y = 2
group_bar_decorate_font_desc = JetBrainsMono Nerd Fonts Regular 12
