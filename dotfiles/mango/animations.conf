# --- Animations ---

# Enable animations for windows and layer surfaces (bars/notifications)
animations=1
layer_animations=1

# Animation Types
# Using 'zoom' for open/close gives a modern feel similar to Niri's default behavior
animation_type_open=zoom
animation_type_close=fade
layer_animation_type_open=slide
layer_animation_type_close=slide

# Fade Settings
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.0
fadeout_begin_opacity=1.0

# Zoom Settings (if using zoom type)
zoom_initial_ratio=0.8
zoom_end_ratio=1.0

# Durations (Converted from Niri's ms values)
# Niri window-open: 200ms -> Mango animation_duration_open
animation_duration_open=200
# Niri window-close: 150ms -> Mango animation_duration_close
animation_duration_close=150
# Movement/Tag switching usually feels better slightly faster or matched to open
animation_duration_move=200
animation_duration_tag=200
animation_duration_focus=0

# Custom Bezier Curves
# Niri "ease-out-expo" approx: 0.16, 1.0, 0.3, 1.0
# Niri "ease-out-quad" approx: 0.25, 0.46, 0.45, 0.94
animation_curve_open=0.16,1.0,0.3,1.0
animation_curve_close=0.25,0.46,0.45,0.94
animation_curve_move=0.16,1.0,0.3,1.0
animation_curve_tag=0.16,1.0,0.3,1.0
animation_curve_focus=0.46,1.0,0.29,0.99
animation_curve_opafadein=0.16,1.0,0.3,1.0
animation_curve_opafadeout=0.25,0.46,0.45,0.94

# Tag Animation Direction (1: horizontal, 0: vertical)
tag_animation_direction=1
