[main]
include=~/.config/theme/current/theme/fuzzel.ini
font=JetBrainsMono Nerd Font
prompt="  "
lines=6
width=24
anchor=center
icons-enabled=yes
icon-theme=Reversal-blue-dark
match-mode=fzf
terminal=kitty -e
line-height=28
horizontal-pad=20
vertical-pad=10
inner-pad=0
layer=top
keyboard-focus=immediate
exit-on-keyboard-focus-loss=no
sort-result=no

[border]
width=3
radius=8
selection-radius=8
