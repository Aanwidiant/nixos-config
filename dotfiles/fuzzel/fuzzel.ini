[main]
include=~/.config/theme/current/theme/fuzzel.ini
font=JetBrainsMono Nerd Font:size=12
prompt=" "
lines=6
width=24
anchor=center
icons-enabled=false
match-mode=fzf
terminal=kitty -e
line-height=28
horizontal-pad=20
vertical-pad=10
inner-pad=0
layer=top
keyboard-focus=on-demand
exit-on-keyboard-focus-loss=no

[border]
width=3
radius=8
selection-radius=8
